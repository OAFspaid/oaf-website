<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="OAF OS — Operational Support System Demo" />
  <title>OAF OS — Alpha</title>

  <!-- PWA manifest & theme -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#c8ad70" />

  <!-- Icons -->
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" href="icons/icon-192.png" type="image/png" />
  <!-- iOS / iPadOS install support -->
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="OAF OS" />

  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <!-- Skip-to-content: first focusable element -->
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <noscript>
    <div style="padding:1.5rem;font-family:system-ui,sans-serif;background:#1e1e1e;color:#f8f6f1;text-align:center;">
      <strong>OAF OS requires JavaScript to run.</strong><br />
      If you are in crisis right now, please reach out immediately — these resources are always available:<br /><br />
      <strong>988 Suicide &amp; Crisis Lifeline:</strong> <a href="tel:988" style="color:#c8ad70;">Call or text 988</a><br />
      <strong>Veterans Crisis Line:</strong> <a href="tel:988" style="color:#c8ad70;">Call 988</a>, then press 1 &mdash; or text <a href="sms:838255" style="color:#c8ad70;">838255</a><br />
      <strong>CopLine (Law Enforcement):</strong> <a href="tel:18002675463" style="color:#c8ad70;">1-800-267-5463</a><br />
    </div>
  </noscript>

  <!-- Update-available banner (hidden until a new SW is waiting) -->
  <div id="pwa-update-banner" class="pwa-update-banner hidden" role="status" aria-live="polite">
    <span>New version available.</span>
    <button id="pwa-update-btn" class="btn btn-sm btn-primary" type="button">Reload to update</button>
  </div>

  <div id="app" class="app-shell">
    <div id="app-header"></div>
    <div id="offline-indicator" class="offline-indicator hidden" role="status" aria-live="polite"></div>
    <div class="app-body">
      <div id="app-nav"></div>
      <main id="main-content">
        <div class="loading-state"><p>Loading…</p></div>
      </main>
    </div>
    <div id="app-footer"></div>
  </div>
  <div id="route-announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/pwa.js"></script>
</body>
</html>
