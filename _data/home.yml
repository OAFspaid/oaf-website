progress:
  title: No Shortcuts, Only Progress
  text: "We’re clear about one thing: There are no shortcuts. Our program provides the tools and guidance you need to become <strong>stronger under stress</strong>. You will train. You will work on your mental and physical health. You will become <strong>antifragile</strong>."
  button_text: About Operation Antifragile
  button_url: /about/

closing:
  title: Designed by Veterans and First Responders, for Veterans and First Responders
  paragraphs:
    - "The journey from service back to civilian life, or finding balance between work and home as a first responder, can be overwhelming. Creating a routine that focuses on total health and wellness can be the key to strength, healing, and hope. Our programs are designed with you in mind—because we’ve walked that same path."
    - "Join us in this new mission. Let’s build positive, sustainable lifestyle habits that will not only help you manage the symptoms of <strong>Operator Syndrome</strong> but also empower you to live a life of resilience, strength, and purpose."
  button_text: Start Your Membership
  button_url: /contact-us/
