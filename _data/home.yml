intro:
  title: What is Antifragile
  columns:
    - "Life after the military or in the service as a first responder comes with a new set of challenges. That’s why we started Operation Antifragile—created by veterans and first responders for those who have dedicated their lives to serving others."
    - "Our mission is simple: to help you become <strong>antifragile</strong>, gaining strength, resilience, and purpose in the face of stress and adversity."

focus:
  eyebrow: Operation Antifragile
  title_html: "Helping you <br>become <br><span>Antifragile</span>"
  text: "There is no “easy” button here. At Operation Antifragile, we believe in a holistic, disciplined approach to health and wellness. You need to train hard, sleep well, and learn to downregulate your nervous system. Transitioning out of the military or balancing the intense demands of a first responder career can be difficult. That’s why we focus on four pillars of well-being:"
  button_text: Join Us on Skool
  button_url: https://www.skool.com/operation-antifragile-6824/about
  button_external: true
  background_image: /wp-content/uploads/bg-2.png

